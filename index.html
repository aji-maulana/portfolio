<style id="site-css">
/* Layout: maroon cover band, gold proof strip, blush case files; one 1120px column, stacked blocks. */
:root{
  --maroon:#650015; --maroon-deep:#47000f; --gold:#F1CF3B; --blush:#fbe9eb;
  --paper:#fffdfc; --ink:#2a0a11; --muted:#6f4a52; --line:#efd3d8; --white:#ffffff;
  --font:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;
  --step-0:1rem; --step-1:1.2rem; --step-2:1.55rem; --step-3:2.1rem; --step-4:clamp(2.1rem,5.2vw,3.7rem);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--maroon)}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,8vw,96px)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sec-head{display:grid;gap:12px;margin-bottom:36px;max-width:62ch}
.sec-head h2{font-size:var(--step-3);font-weight:800;line-height:1.15}
.sec-head p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:var(--font)}
.btn:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn-gold{background:var(--gold);color:var(--maroon-deep)}
.btn-ghost{border-color:currentColor;color:inherit;background:transparent}
.btn-maroon{background:var(--maroon);color:var(--white)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--maroon);color:var(--blush)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{font-weight:800;letter-spacing:.02em;font-size:1.05rem;white-space:nowrap}
.brand span{color:var(--gold)}
.menu{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;font-size:.9rem;font-weight:600}
.menu a{text-decoration:none;opacity:.9}
.menu a:hover{opacity:1;color:var(--gold)}
.top .btn{padding:8px 16px;font-size:.85rem}
.menu-btn{display:none;margin-left:auto;background:transparent;border:2px solid rgba(251,233,235,.5);color:var(--blush);border-radius:999px;padding:6px 14px;font:700 .82rem var(--font);cursor:pointer}
.mnav{display:none}
@media (max-width:760px){
  .menu{display:none}.top .btn{display:none}.menu-btn{display:inline-flex}
  .top .wrap{min-height:56px}
  .top .wrap.mnav{display:grid;gap:2px;padding-bottom:14px;min-height:0}
  .mnav[hidden]{display:none!important}
  .mnav a{display:block;padding:12px 4px;border-bottom:1px solid rgba(251,233,235,.18);text-decoration:none;font-weight:700;font-size:1.05rem}
  .top .mnav .btn{display:flex;margin-top:12px;justify-content:center;border-bottom:0;padding:12px 20px}
}

/* hero */
.hero{background:var(--maroon);color:var(--blush)}
.hero .wrap{display:grid;grid-template-columns:1.5fr .9fr;gap:48px;align-items:center}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:var(--step-4);font-weight:800;line-height:1.08;color:var(--white)}
.hero .sub{font-size:var(--step-1);max-width:56ch;color:var(--blush)}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.orgs{border-top:1px solid rgba(251,233,235,.25);padding-top:18px;display:grid;gap:8px}
.orgs .lbl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.orgs .names{font-weight:600;font-size:.95rem}
.portrait{aspect-ratio:4/5;max-width:100%;border-radius:28px 28px 120px 28px;overflow:hidden;background:var(--gold);display:grid;place-items:center;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.mono{font-weight:800;font-size:clamp(3rem,9vw,6rem);color:var(--maroon);letter-spacing:-.04em}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.portrait{max-width:320px}}


/* stats */
.stats{background:var(--gold);color:var(--maroon-deep)}
.stats .sec{padding-block:44px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
.stat{display:grid;gap:4px;align-content:start}
.stat .v{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-weight:600}
.stat .s{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8}

/* work */
.work{background:var(--blush)}
.work .eyebrow{color:var(--maroon)}
.cases{display:grid;gap:22px}
.case{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}
.case.noimg{grid-template-columns:minmax(0,1fr)}
.case .meta{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon)}
.case h3{font-size:var(--step-2);font-weight:800;line-height:1.2;margin-top:6px}
.case .role{color:var(--muted);font-weight:600;font-size:.92rem;margin-top:4px}
.case .sum{margin-top:12px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--blush);color:var(--maroon)}
.case details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.case summary{cursor:pointer;font-weight:700;color:var(--maroon);list-style:none}
.case summary::-webkit-details-marker{display:none}
.case summary::after{content:" +"}
.case details[open] summary::after{content:" \2013"}
.cs{display:grid;gap:14px;margin-top:14px}
.cs h4{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);margin:0 0 4px}
.cs p,.pl{white-space:pre-line}
.results{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.results li{padding-left:18px;position:relative;font-weight:600}
.results li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--gold)}
.case .pic{border-radius:16px;overflow:hidden;background:var(--blush);aspect-ratio:4/3;align-self:start;max-width:100%}
.case .pic img{width:100%;height:100%;object-fit:cover;display:block}
.case .more{display:inline-block;margin-top:12px;font-weight:700;color:var(--maroon)}
.case .fig{margin:0;display:grid;gap:10px;align-content:start;min-width:0}
.case .pic-desc{font-size:.85rem;line-height:1.5;color:var(--muted);padding-left:12px;border-left:3px solid var(--gold)}
@media (max-width:760px){.case{grid-template-columns:minmax(0,1fr)}}

/* writing */
.writing .eyebrow{color:var(--maroon)}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.w-item{border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:8px;align-content:start;background:var(--white);min-width:0}
.w-item .k{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon)}
.w-item h3{font-size:1.05rem;font-weight:700;line-height:1.35}
.w-item h3 a{text-decoration:none}
.w-item h3 a:hover{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px}
.w-item .o{color:var(--muted);font-size:.88rem}

/* skills */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.sk-col h3{font-size:1.05rem;font-weight:800;color:var(--maroon);padding-bottom:10px;border-bottom:3px solid var(--gold);margin-bottom:12px}
.sk-col ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.tools{margin-top:32px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .lbl{font-weight:700;margin-right:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;background:var(--white)}

/* about */
.about{background:var(--blush)}
.about .eyebrow{color:var(--maroon)}
.ab-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px}
.ab-body{font-size:1.05rem;max-width:60ch}
.tl{margin:0;padding:0;list-style:none;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl .y{font-weight:700;color:var(--maroon);font-size:.88rem;font-variant-numeric:tabular-nums}
.tl .r{font-weight:700}
.tl .g{color:var(--muted);font-size:.9rem}
@media (max-width:760px){.ab-grid{grid-template-columns:minmax(0,1fr)}.tl li{grid-template-columns:1fr;gap:2px}}

/* contact */
.contact{background:var(--maroon);color:var(--blush)}
.contact .eyebrow{color:var(--gold)}
.contact h2{font-size:var(--step-4);color:var(--white);font-weight:800;line-height:1.1}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:32px}
.ct{border:1px solid rgba(251,233,235,.3);border-radius:18px;padding:18px;display:grid;gap:8px;min-width:0}
.ct .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.ct .v{font-weight:700;overflow-wrap:anywhere;user-select:all}
.ct a{color:var(--white)}
.copy{justify-self:start;background:transparent;border:1px solid rgba(251,233,235,.5);color:var(--blush);border-radius:999px;padding:4px 12px;font:600 .8rem var(--font);cursor:pointer}
.contact .ctas{margin-top:28px}
footer{background:var(--maroon-deep);color:var(--blush);font-size:.85rem}
footer .wrap{padding-block:20px}

/* generic blocks */
.text-blk .body{max-width:65ch;white-space:pre-line;font-size:1.05rem}
.cta-band{background:var(--gold);color:var(--maroon-deep)}
.cta-band .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:var(--step-2);font-weight:800;max-width:40ch}
.quote{background:var(--blush)}
.quote blockquote{margin:0;font-size:var(--step-2);font-weight:600;font-style:italic;line-height:1.35;color:var(--maroon);max-width:40ch}
.quote .who{margin-top:16px;font-weight:700}

/* ---------- editor ---------- */
.edit-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 6px 20px rgba(42,10,17,.25)}
body.editing{padding-bottom:140px}
.blk{position:relative}
body.editing .blk{outline:2px dashed rgba(101,0,21,.35);outline-offset:-6px}
body.editing .blk.is-hidden{opacity:.45}
.chrome{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));z-index:20;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 4px 14px rgba(42,10,17,.15);font-size:.78rem;max-width:calc(100% - 20px)}
.chrome .handle{cursor:grab;padding:4px 8px;font-weight:800;color:var(--maroon);letter-spacing:-.1em;user-select:none}
.chrome .tname{font-weight:700;padding:0 6px}
.chrome button,.mini{font:600 .76rem var(--font);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 8px;cursor:pointer}
.chrome button:hover,.mini:hover{border-color:var(--maroon)}
.chrome button.danger{color:#9b1c1c}
.chrome button.armed{background:#9b1c1c;color:var(--white);border-color:#9b1c1c}
.chrome input{font:500 .76rem var(--font);border:1px solid var(--line);border-radius:8px;padding:4px 6px;width:110px}
body.editing .blk > .sec, body.editing .blk > .stats > .sec{padding-top:max(72px,clamp(56px,8vw,96px))}
[contenteditable="true"]{outline:1px dashed rgba(101,0,21,.3);outline-offset:2px;border-radius:4px;cursor:text;min-width:2ch}
.hero [contenteditable="true"],.contact [contenteditable="true"]{outline-color:rgba(241,207,59,.55)}
[contenteditable="true"]:focus{outline:2px solid var(--gold);background:rgba(241,207,59,.12)}
[contenteditable="true"]:empty::before{content:attr(data-ph);opacity:.5;font-style:italic}
.field{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.75rem;margin-top:6px}
.field label{font-weight:700;opacity:.8}
.field input{font:500 .8rem var(--font);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0;flex:1 1 220px;max-width:420px;color:var(--ink);background:var(--white)}
.itemctl{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.addrow{margin-top:14px}
.dz{height:8px;transition:height .15s;margin:0}
body.dragging .dz{height:34px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 20px);background-size:100% 3px;background-repeat:no-repeat;background-position:center}
body.dragging .dz.over{height:64px;background:rgba(241,207,59,.35);outline:2px dashed var(--maroon);outline-offset:-4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:var(--blush);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px}
.bar .status{font-size:.82rem;opacity:.9;margin-right:auto;min-width:0}
.bar button{font:700 .85rem var(--font);border-radius:999px;padding:8px 14px;border:1px solid rgba(251,233,235,.4);background:transparent;color:var(--blush);cursor:pointer}
.bar button.primary{background:var(--gold);color:var(--maroon-deep);border-color:var(--gold)}
.bar button:disabled{opacity:.45;cursor:default}
.palette{background:#3b1118;border-top:1px solid rgba(251,233,235,.15)}
.palette .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:10px}
.palette .hint{font-size:.78rem;opacity:.8;width:100%}
.pchip{font:700 .8rem var(--font);background:var(--blush);color:var(--maroon);border:0;border-radius:10px;padding:8px 12px;cursor:grab}
.settings{background:var(--ink);color:var(--blush)}
.settings .wrap{padding-block:16px;display:grid;gap:4px}
.settings .field input{max-width:520px}
.banner{background:var(--gold);color:var(--maroon-deep);font-weight:600;font-size:.9rem}
.banner .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.hidden-tag{font:700 .7rem var(--font);background:var(--ink);color:var(--blush);border-radius:6px;padding:2px 6px}
@media (max-width:560px){
  .sec{padding-block:48px}
  .hero .wrap{gap:28px}
  .hero .wrap>div:last-child{order:-1}
  .portrait{max-width:150px;border-radius:20px 20px 60px 20px}
  .mono{font-size:3rem}
  .hero .sub{font-size:1.05rem}
  .hero .ctas .btn{flex:1 1 100%;justify-content:center}
  .stats .sec{padding-block:32px}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
  .stat .v{font-size:1.7rem}
  .stat .l{font-size:.9rem;line-height:1.35}
  .sec-head{margin-bottom:24px}
  .sec-head h2{font-size:1.6rem}
  .case{padding:18px;gap:16px;border-radius:18px}
  .case>.fig{order:-1}
  .case .pic{aspect-ratio:16/10}
  .case h3{font-size:1.3rem}
  .w-grid{grid-template-columns:minmax(0,1fr)}
  .contact h2{font-size:2rem}
  .ct-grid{grid-template-columns:minmax(0,1fr)}
  .contact .ctas .btn{width:100%;justify-content:center}
  body.editing .blk > .sec, body.editing .blk > .stats > .sec{padding-top:96px}
  .chrome{font-size:.72rem;right:max(10px,env(safe-area-inset-right,0px))}
  .chrome .tname{display:none}
  .chrome input{width:90px}
  .bar .wrap{gap:6px}
  .bar .status{flex:1 1 100%;font-size:.78rem}
  .bar button{padding:8px 11px;font-size:.8rem;flex:1 1 auto}
  .bar .palette .wrap{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .palette .hint{display:none}
  .pchip{flex:0 0 auto;white-space:nowrap}
  body.editing{padding-bottom:190px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

/* ---------- block chrome & drag ---------- */
function moveBlock(from,to){var a=state.blocks;if(to>from)to--;if(from===to)return;snap();var b=a.splice(from,1)[0];a.splice(to,0,b);touch();render();}
function dropZone(idx){
  var z=h("div",{class:"dz","aria-hidden":"true"});
  z.addEventListener("dragover",function(ev){if(!dragData)return;ev.preventDefault();z.classList.add("over");});
  z.addEventListener("dragleave",function(){z.classList.remove("over");});
  z.addEventListener("drop",function(ev){ev.preventDefault();z.classList.remove("over");var d=dragData;endDrag();if(!d)return;
    if(d.kind==="move")moveBlock(d.index,idx);else{snap();var nb=newBlock(d.type);state.blocks.splice(idx,0,nb);touch();render();focusBlock(nb.id);}});
  return z;
}
function startDrag(d,ev){dragData=d;document.body.classList.add("dragging");try{ev.dataTransfer.setData("text/plain",d.kind);ev.dataTransfer.effectAllowed=d.kind==="move"?"move":"copy";}catch(e){}}
function endDrag(){dragData=null;document.body.classList.remove("dragging");}
document.addEventListener("dragend",endDrag);
function chrome(b,i){
  var n=state.blocks.length;
  var handle=h("span",{class:"handle",draggable:"true",title:"Drag to move",text:"⋮⋮"});
  handle.addEventListener("dragstart",function(ev){startDrag({kind:"move",index:i},ev);});
  var del=h("button",{type:"button",class:"danger",text:"Delete"});
  del.addEventListener("click",function(){
    if(del.classList.contains("armed")){snap();state.blocks.splice(i,1);touch();render();status("Block deleted. Use Undo to bring it back.");return;}
    del.classList.add("armed");del.textContent="Confirm delete";setTimeout(function(){if(del.isConnected){del.classList.remove("armed");del.textContent="Delete";}},3500);
  });
  var navInp=h("input",{id:"nav-"+b.id,type:"text",value:b.nav||"",placeholder:"not in menu","aria-label":"Menu label"});
  navInp.addEventListener("focus",snap);navInp.addEventListener("input",function(){b.nav=navInp.value;touch();});
  navInp.addEventListener("change",function(){render();});
  return h("div",{class:"chrome"},[handle,h("span",{class:"tname",text:TYPES[b.type].name}),
    b.hidden?h("span",{class:"hidden-tag",text:"Hidden"}):null,
    h("button",{type:"button",disabled:i===0,onclick:function(){moveBlock(i,i-1);},"aria-label":"Move block up",text:"↑"}),
    h("button",{type:"button",disabled:i===n-1,onclick:function(){moveBlock(i,i+2);},"aria-label":"Move block down",text:"↓"}),
    h("button",{type:"button",onclick:function(){snap();b.hidden=!b.hidden;touch();render();},text:b.hidden?"Show":"Hide"}),
    h("button",{type:"button",onclick:function(){snap();var c=JSON.parse(JSON.stringify(b));c.id=b.type+"-"+Math.random().toString(36).slice(2,7);c.nav="";state.blocks.splice(i+1,0,c);touch();render();},text:"Duplicate"}),
    h("label",{for:"nav-"+b.id,style:"font-weight:700;padding-left:4px",text:"Menu:"}),navInp,del]);
}
function focusBlock(id){var e=document.getElementById(id);if(e)e.scrollIntoView({behavior:"smooth",block:"start"});}

function header(){

  var mlinks=state.blocks.filter(function(b){return b.nav&&!b.hidden;}).map(function(b){return h("a",{href:"#"+b.id,text:b.nav,onclick:function(){menuOpen=false;var m=document.getElementById("mnav");if(m)m.hidden=true;var t=document.getElementById("menu-btn");if(t){t.setAttribute("aria-expanded","false");t.textContent="Menu";}}});});

var barEl=null, statusEl=null, publishBtn=null, undoBtn=null;
function status(m){statusMsg=m;if(statusEl)statusEl.textContent=m;}
function updateBar(){
  if(!statusEl)return;
  publishBtn.disabled=!dirty||!artifactNs;undoBtn.disabled=!history.length;
  if(!statusMsg||/^(All changes published|Unpublished changes)/.test(statusMsg))statusEl.textContent=dirty?"Unpublished changes. Visitors still see the last published version.":"All changes published.";
}

  statusEl=h("div",{class:"status","aria-live":"polite"});
  undoBtn=h("button",{type:"button",onclick:function(){if(!history.length)return;state=JSON.parse(history.pop());touch();render();},text:"Undo"});
  publishBtn=h("button",{type:"button",class:"primary",onclick:publish,text:"Publish changes"});
  var pal=paletteOpen?h("div",{class:"palette"},[h("div",{class:"wrap"},[h("div",{class:"hint",text:"Drag a block onto the page, or tap one to add it at the end."})].concat(
    Object.keys(TYPES).map(function(t){var c=h("button",{class:"pchip",type:"button",draggable:"true",text:TYPES[t].name});
      c.addEventListener("dragstart",function(ev){startDrag({kind:"new",type:t},ev);});
      c.addEventListener("click",function(){snap();var nb=newBlock(t);state.blocks.push(nb);touch();render();focusBlock(nb.id);status(TYPES[t].name+" added at the end. Drag or use the arrows to move it.");});
      return c;})))]):null;
  barEl=h("div",{class:"bar"},[pal,h("div",{class:"wrap"},[statusEl,
    h("button",{type:"button",onclick:function(){paletteOpen=!paletteOpen;render();},text:paletteOpen?"Close blocks":"+ Add block"}),
    undoBtn,
    h("button",{type:"button",onclick:discard,text:"Discard changes"}),
    h("button",{type:"button",onclick:function(){editing=false;paletteOpen=false;render();},text:"Preview"}),
    publishBtn])]);
  statusEl.textContent=statusMsg;
  updateBar();
  return barEl;
}
var discardArmed=false;
function discard(ev){
  var b=ev.currentTarget;
  if(!dirty){status("Nothing to discard.");return;}
  if(!discardArmed){discardArmed=true;b.textContent="Click again to discard";setTimeout(function(){discardArmed=false;if(b.isConnected)b.textContent="Discard changes";},3500);return;}
  discardArmed=false;state=JSON.parse(saved);history=[];try{localStorage.removeItem(DRAFT);}catch(e){}dirty=false;status("Changes discarded.");render();
}
function copyText(t,btn){
  var ok=function(){btn.textContent="Copied";setTimeout(function(){btn.textContent="Copy";},1600);};
  try{navigator.clipboard.writeText(t).then(ok).catch(function(){selectNear(btn);});}catch(e){selectNear(btn);}

function selectNear(btn){var v=btn.parentNode.querySelector(".v");if(!v)return;var r=document.createRange();r.selectNodeContents(v);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Press Ctrl/Cmd+C";}

/* ---------- publish ---------- */
function escHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var RESET=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function buildDoc(){
  var hs=document.head&&document.head.querySelector("style:not(#site-css)");
  var reset=hs?hs.textContent:RESET;
  var css=document.getElementById("site-css").textContent;
  var app=document.getElementById("site-app").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var S="script";
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+reset+"</style></head><body>"+
    "<title>"+escHtml(state.meta.title||"Portfolio")+"</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n"+
    "<meta name=\"description\" content=\""+escHtml(state.meta.description||"")+"\">\n"+
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap\">\n"+
    "<style id=\"site-css\">"+css+"</style>\n<div id=\"root\"></div>\n"+

    "<"+S+" id=\"site-app\">"+app+"</"+S+">\n</body></html>";
}
function publish(){
  if(!artifactNs||!dirty)return;
  publishBtn.disabled=true;status("Publishing…");
  artifactNs.publish(buildDoc()).then(function(){try{localStorage.removeItem(DRAFT);}catch(e){}saved=JSON.stringify(state);dirty=false;status("Published. The page is reloading with your changes.");})
  .catch(function(e){var c=e&&e.code;publishBtn.disabled=false;
    if(c==="conflict")status("A newer version was published elsewhere. The page will reload to it; your draft is kept on this device.");
    else if(c==="not_writer"||c==="not_granted"){status("You can view this page but can't publish changes to it.");artifactNs=null;updateBar();}
    else if(c==="rate_limited")status("Too many saves in a short time. Wait a minute, then publish again.");
    else status("Couldn't publish: "+((e&&e.message)||"unknown error")+". Your changes are kept on this device.");});
}

var canEdit=false;
function render(){

    h("button",{class:"mini",type:"button",onclick:function(){draftPending=null;try{localStorage.removeItem(DRAFT);}catch(e){}render();},text:"Discard them"})])]));
  kids.push(header());
  var main=h("main");
  state.blocks.forEach(function(b,i){

}

  editing=true;statusMsg="";

}
